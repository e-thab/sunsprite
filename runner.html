<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunsprite sandbox</title>

    <!--
      Second Vite entry point, loaded only inside the <iframe sandbox="allow-scripts">
      that PhaserCanvas.vue renders. Everything here runs in an opaque origin: Phaser,
      the Sunsprite game API, and the user's own scripts. It has no access to the editor
      app's DOM, storage, or Supabase session, and talks to the host purely by postMessage.

      Deliberately no Google Fonts <link> like index.html has — an opaque origin can't
      benefit from the parent's font cache, and pulling third-party subresources into the
      sandbox would widen its network surface for no gain. Phaser renders text into the
      canvas with whatever family the Label asks for, falling back to a generic.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* Nothing in here is text to select — a click-drag on the canvas is
           gameplay input, not a selection gesture, so the browser's own blue
           selection highlight should never be able to land on it. */
        user-select: none;
        -webkit-user-select: none;
      }

      #game-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      /* Shown by src/sandbox/audioGate.ts only when the browser won't let the
         game make sound yet. Sits over the canvas, so the click that dismisses
         it never reaches the game as input. */
      #audio-gate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font: 600 16px system-ui, sans-serif;
        cursor: pointer;
      }

      #audio-gate[hidden] {
        display: none;
      }

      #audio-gate svg {
        width: 64px;
        height: 64px;
        transition: transform 0.1s ease-out;
      }

      #audio-gate:hover svg {
        transform: scale(1.08);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <button id="audio-gate" type="button" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="rgba(255, 255, 255, 0.15)" stroke="currentColor" stroke-width="3" />
        <path d="M26 20 L46 32 L26 44 Z" fill="currentColor" />
      </svg>
      Click to play
    </button>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
