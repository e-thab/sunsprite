<!DOCTYPE html>
<html lang="" class="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/sun.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunsprite</title>

    <!-- Re-applies the theme this device last showed, from the snapshot
         themeStore.ts's applyToDocument saves, before anything paints.
         Everything else that knows the theme waits on main.ts, which on the
         dev server can take a while to load, and a theme other than the
         default would flash the default until then. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('sunsprite-theme-paint') || 'null');
        if (saved && saved.variables) {
          var html = document.documentElement;
          html.classList.toggle('dark', !saved.isLight);
          html.classList.toggle('light', !!saved.isLight);
          for (var name in saved.variables) html.style.setProperty(name, saved.variables[name]);
        }
      } catch (e) {}
    </script>

    <!-- The saved theme's background, else base.css's --theme-bg fallback.
         Vite's dev server injects app CSS via JS instead of a blocking <link>,
         so without this the browser paints a blank white frame before
         main.ts's stylesheet import lands. -->
    <style>
      html, body { background: var(--theme-bg, #1d1f23); }
    </style>

    <!-- ! Remove this script when switching hosts -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Restores the real path stashed by 404.html before the router mounts.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          )
        }
      })(window.location);
    </script>
    <!-- ! Remove this script when switching hosts -->
  
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
