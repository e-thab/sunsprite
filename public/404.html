<!-- ! Remove this file when switching hosts -->
<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <title>Sunsprite</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This is a workaround for GitHub Pages not supporting server-side
      // rewrites, so a hard refresh on a client-side route 404s. It stashes
      // the intended path in the query string and redirects to the app root,
      // where index.html restores it via history.replaceState.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
